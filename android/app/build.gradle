import java.util.Properties

apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = keystoreProperties['storeFile'] ?: System.getenv('DATSER_ANDROID_KEYSTORE_FILE')
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv('DATSER_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('DATSER_ANDROID_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('DATSER_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && it.toString().trim()
}

android {
    namespace = "com.datser.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.datser.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // A local Android test must install beside the production app.
            // Keep the release package name, signing identity, and upgrade
            // path unchanged while avoiding a production/debug signer clash.
            applicationIdSuffix ".offlinefirst"
            versionNameSuffix "-offline-test"
            resValue "string", "app_name", "DatSer Offline Test"
            resValue "string", "title_activity_main", "DatSer Offline Test"
            resValue "string", "package_name", "com.datser.app.offlinefirst"
            resValue "string", "custom_url_scheme", "com.datser.app.offlinefirst"
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Keep production's version (6 / 1.0.5) untouched. The installable offline
// test variant must be newer than the prior tablet build while remaining a
// separate package with its own debug signing identity.
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(9)
            output.versionName.set('1.0.8-offline-test')
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(':app:assembleRelease') && !hasReleaseSigning) {
        throw new GradleException('Release signing is not configured. Create android/keystore.properties or set DATSER_ANDROID_KEYSTORE_* environment variables. See ANDROID_APK.md.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
